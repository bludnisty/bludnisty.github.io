<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="./storage/storage.js" defer></script>
    <script src="js/main.js" defer></script>

    <link rel="icon" href="img/icon.png">
    <link rel="stylesheet" href="css/style.css">

    <title>Gif Manager</title>
</head>

<body>
    <div id="tooltip">Copied link!</div>

    <div id="top-bar">
        <div id="input-container">
            <input id="input-search" type="text" placeholder="Search tags...">

            <div id="buttons">
                <div class="button-container">
                    <label class="toggle-switch">
                        <input id="input-nsfw" type="checkbox">
                        <span class="slider"></span>
                    </label>
                    <span class="switch-label">
                        NSFW
                        <span class="count">
                            (<span id="count-nsfw">54</span>)
                        </span>
                    </span>
                </div>

                <div class="button-container">
                    <label class="toggle-switch">
                        <input id="input-racist" type="checkbox">
                        <span class="slider"></span>
                    </label>
                    <span class="switch-label">
                        Racist
                        <span class="count">
                            (<span id="count-racist">32</span>)</span>
                    </span>
                </div>

                <div class="button-container" style="display: none;">
                    <label class="toggle-switch">
                        <input id="input-gore" type="checkbox">
                        <span class="slider"></span>
                    </label>
                    <span class="switch-label">
                        Gore
                        <span class="count">
                            (<span id="count-gore">12</span>)
                        </span>
                    </span>
                </div>

                <div class="count">
                    <span id="count-results"></span>
                </div>
            </div>

        </div>

        <div id="theme-button"></div>
    </div>

    <div id="gifs"></div>
</body>

</html>
