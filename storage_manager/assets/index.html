<style>

*, *::before, *::after {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    padding: 0;
    margin: 0;
}

h1, h2 {
    padding: 1rem;
    margin: 0;
}

#save-changes {
    position: sticky;
    top: 50px;
    left: 20px;
    z-index: 1000;
}

#table {
    display: flex;
    flex-direction: column;
    width: 100%;
}

.row {
    display: flex;
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    width: 100%;
}

main .row:nth-child(even) {
    background-color: rgb(180, 180, 180);
}
main .row:nth-child(odd) {
    background-color: rgb(236, 236, 236);
}

main .row:hover {
    background-color: rgb(70, 70, 70);
    color: white;
}

header {
    position: sticky;
    top: 0;
    z-index: 999;
    font-weight: bold;
    font-size: 1.25rem;
    height: 50px;
    background-color: rgb(128, 128, 128);
}

header .preview {
    padding-left: 20px;
}

.cell {
    padding: 0 10px;
}

.preview {
    width: 8%;
    overflow: hidden;
    padding: 0;
}
.filename {
    display: block;
    width: 12%;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: help;
}
.tags { width: 68%; }
.checkbox {
    display: flex;
    width: 4%;
    justify-content: center;
}

img {
    height: 50px;
}

input[type="text"], input[type="checkbox"]  {
    width: 100%;
}

input[type="checkbox"] {
    scale: 1.25;
}

.hidden {
    display: none;
}

.big-img {
    position: fixed;
    height: 50vmin;
    z-index: 9999999999999;
    left: 0;
    /* bottom: 20px; */
}

.filename.editable {
    cursor: pointer;
}

#rename-file-container {
    display: none;
    position: fixed;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.527);

    z-index: 99999999;
}

.dialog {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    display: flex;
    flex-direction: column;
    gap: 20px;

    width: 100%;
    max-width: 500px;
    padding: 20px;
    background-color: white;
}

.dialog .buttons {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    gap: 20px;
}

.dialog button {
    width: 100%
}

.dialog h1,
.dialog p {
    padding: 0;
    margin: 0;
}

#dialog-filename {
    font-weight: bold;
    font-size: 1.25rem;
}

</style>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gif Storage Manager</title>
</head>
<body>
    <div id="rename-file-container">
        <form action="/rename_file" method="post">
            <div class="dialog">
                <h1>Rename file</h1>
                <p>Renaming <span id="dialog-filename">cosikten.gif</span></p>
                <input id="dialog-new-name" name="new_filename" type="text" value="cosikten.gif" placeholder="Enter new filename...">
                <input id="dialog-old-name" name="old_filename" type="hidden" value="anime-feet.gif">
                <div class="buttons">
                    <button id="dialog-submit" type="submit">Rename</button>
                    <button id="dialog-reset" type="button">Set original name</button>
                    <button id="dialog-cancel" type="button">Cancel</button>
                </div>
            </div>
        </form>
    </div>

    <h1>Gif Manager Storage Manager</h1>
    
    <form action="/save_storage" method="post">
        <input id="save-changes" type="submit" value="Save changes / add all to storage">

        <h2 {{hide}}>Not added to storage</h2>

        <div id="table" {{hide}}>
            <header class="row">
                <div class="cell preview">Preview</div>
                <div class="cell filename">Filename</div>
                <div class="cell tags">Tags</div>
                <div class="cell checkbox nsfw">NSFW</div>
                <div class="cell checkbox racist">Racist</div>
                <div class="cell checkbox gore">Gore</div>
            </header>
            <main>
                {{not_in_storage}}
            </main>
        </div>

        <h2>In storage</h2>
        <div id="table">
            <header class="row">
                <div class="cell preview">Preview</div>
                <div class="cell filename">Filename</div>
                <div class="cell tags">Tags</div>
                <div class="cell checkbox nsfw">NSFW</div>
                <div class="cell checkbox racist">Racist</div>
                <div class="cell checkbox gore">Gore</div>
            </header>
            <main>
                {{in_storage}}
            </main>
        </div>

    </form>
</body>
</html>


<script>

const imgs = document.querySelectorAll("img")
const editable_filenames = document.querySelectorAll(".filename.editable")
const dialog = {
    container: document.querySelector("#rename-file-container"),
    filename: document.querySelector("#dialog-filename"),
    new_name: document.querySelector("#dialog-new-name"),
    old_name: document.querySelector("#dialog-old-name"),
    submit: document.querySelector("#dialog-submit"),
    reset: document.querySelector("#dialog-reset"),
    cancel: document.querySelector("#dialog-cancel"),
    shown: false,
}

imgs.forEach((img) => {
    let big = document.createElement("img")
    big.src = img.src
    big.classList.add("big-img")

    img.addEventListener("mouseenter", () => {
        document.body.appendChild(big)
    })
    img.addEventListener("mousemove", (e) => {
        let height = parseFloat(window.getComputedStyle(big).getPropertyValue("height").slice(0, -2))

        let left = `${e.clientX + 20}px`
        let top = 0

        if (e.clientY + height > window.innerHeight) {
            top = `${e.clientY - height}px`
        }
        else {
            top = `${e.clientY}px`
        }
        big.style.left = left
        big.style.top = top
    })
    img.addEventListener("mouseleave", () => {
        big.remove()
    })
})

editable_filenames.forEach((element) => {
    element.addEventListener("click", () => {
        dialog.container.style.display = "flex"
        dialog.shown = true
        dialog.filename.innerHTML = element.innerHTML
        dialog.new_name.value = element.innerHTML
        dialog.old_name.value = element.innerHTML
    })
})

dialog.reset.addEventListener("click", () => {
    dialog.new_name.value = dialog.old_name.value   
})

dialog.cancel.addEventListener("click", () => {
    dialog.container.style.display = "none"
    dialog.shown = false
})

window.addEventListener("keydown", (e) => {
    if (e.key == "Escape" && dialog.shown == true) {
        dialog.container.style = "none"
        dialog.shown = false
    }
})

</script>
